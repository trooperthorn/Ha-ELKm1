name: Auto-Release Custom Component

on:
  push:
    branches: [main]
  workflow_dispatch: # Also allows you to trigger it manually if needed

permissions:
  contents: write # Required to create tags and releases

# This concurrency block creates the 10-minute debounce. 
# Any new push will cancel the currently running/sleeping workflow and start fresh.
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for inactivity
        run: |
          echo "Waiting 10 minutes to ensure no further updates are pushed..."
          sleep 600

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to count previous tags for same-day runs
      
      - name: Generate version from date (with run counter)
        id: version
        run: |
          git fetch --tags --force
          CALVER=$(date +'%Y.%m.%d')
          
          # Count how many tags already exist today
          TAG_COUNT=$(git tag -l "v${CALVER}*" | wc -l | xargs)
          
          # Force the count to be at least two digits (00, 01... 09, 10)
          PADDED_COUNT=$(printf "%02d" $TAG_COUNT)
          VERSION="${CALVER}.${PADDED_COUNT}"
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Update manifest.json
        run: |
          jq ".version = \"${{ steps.version.outputs.VERSION }}\"" custom_components/elkm1/manifest.json > tmp.json && mv tmp.json custom_components/elkm1/manifest.json
      
      - name: Zip integration
        run: |
          cd custom_components/elkm1
          zip -r ../../elkm1.zip .
      
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.TAG }}" elkm1.zip \
            --title "Elk-M1 ${{ steps.version.outputs.TAG }}" \
            --notes "Automatic release from latest commit: ${{ github.sha }}"
