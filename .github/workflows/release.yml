name: Release Integration

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Refresh HACS Action
        uses: hacs/integration@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
