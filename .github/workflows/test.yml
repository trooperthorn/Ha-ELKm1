name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ha-version: "2025.4.4", python-version: "3.13" }
          - { ha-version: "2026.2.3", python-version: "3.13" }
          - { ha-version: "2026.8.2", python-version: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "homeassistant==${{ matrix.ha-version }}" \
            -c "https://raw.githubusercontent.com/home-assistant/core/${{ matrix.ha-version }}/homeassistant/package_constraints.txt"
          pip install -r requirements-dev.txt \
            -c "https://raw.githubusercontent.com/home-assistant/core/${{ matrix.ha-version }}/homeassistant/package_constraints.txt"
            
      - name: Run Pytest
        run: pytest tests/
