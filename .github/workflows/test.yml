name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          
          # This line reads manifest.json and installs elkm1_lib automatically
          jq -r '.requirements[]' custom_components/elkm1/manifest.json | xargs pip install
          
      - name: Run Pytest with Coverage
        run: |
          pytest tests --cov=custom_components/elkm1 --cov-report=term-missing
      
      - name: Lint with ruff
        run: ruff check custom_components/elkm1
      
      - name: Type check with mypy
        run: mypy custom_components/elkm1
      
      - name: Run tests with pytest
        run: pytest tests --cov=custom_components/elkm1 --cov-report=term-missing
      
      - name: Validate manifest
        run: python -m script.hassfest --integration-path custom_components/elkm1
