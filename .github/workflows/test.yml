name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      
      - name: Lint with ruff
        run: ruff check custom_components/elkm1
      
      - name: Type check with mypy
        run: mypy custom_components/elkm1
      
      - name: Run tests with pytest
        run: pytest tests --cov=custom_components/elkm1 --cov-report=term-missing
      
      - name: Validate manifest
        run: python -m script.hassfest --integration-path custom_components/elkm1
