rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: |
      local_push primary (elk.add_handler per message type); update_interval
      is a configurable fallback poll rate (options flow) for panels with
      broadcast categories disabled in Global Programming.
  brands:
    status: todo
    comment: |
      Requires submitting a logo/icon to home-assistant/brands, an external
      repo - not something this codebase can complete on its own.
  common-modules: done
  config-flow-test-coverage:
    status: todo
    comment: |
      tests/test_config_flow.py now has 13 real, passing tests (user,
      manual network, serial, options, reconfigure network/serial, reauth
      network/serial-unsupported, and their error paths), up from one
      broken test patching a class (ElkM1Connection) that hasn't existed
      since the hybrid transport rework. config_flow.py measures at 65%
      line coverage - real but not complete: discovery-driven steps
      (dhcp/integration_discovery/discovered_connection/usb/usb_confirm)
      aren't covered yet.
  config-flow: done
  dependency-transparency:
    status: done
    comment: |
      elkm1-lib is public on PyPI, source at github.com/gwww/elkm1, pinned
      to 2.2.15 in manifest.json.
  docs-actions:
    status: done
    comment: README's Services section lists every real domain-level and entity-level service, matching services.yaml.
  docs-high-level-description:
    status: done
    comment: |
      README.md rewritten - it previously had duplicate H1/Features/
      Installation/Services sections and a literal "## OLD INFO I WANT TO
      ADD BACK AND VERIFY" draft section left in place.
  docs-installation-instructions:
    status: done
    comment: README's Installation section covers HACS, manual install, and initial setup (discovery vs. manual vs. serial).
  docs-removal-instructions:
    status: done
    comment: README's "Removing the integration" section.
  entity-event-setup:
    status: done
    comment: |
      Entities are CoordinatorEntity-based; push updates are registered
      once per message type at the coordinator (elk.add_handler in
      _register_push_callbacks), not ad hoc per entity, so there's no
      per-entity listener setup/teardown to get wrong.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: config_flow.py's validate_input() opens a real, briefly-lived connection before creating the entry.
  test-before-setup:
    status: done
    comment: |
      coordinator._async_setup() waits for the panel's own "login" event
      (success or failure) before the first refresh is considered
      complete, rather than assuming a raw socket/serial open means the
      panel is actually there and responding.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: |
      alarm_control_panel.py's command methods used to catch and only log
      failures, so a failed arm/disarm/bypass command looked like success
      to HA. Fixed to raise HomeAssistantError via a shared
      _async_run_command() helper. Other write-capable platforms
      (switch/number/light/climate) don't wrap their calls in a swallowing
      try/except, so exceptions already propagated correctly there.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: |
      strings.json's options/reconfigure step descriptions document each
      field directly in the flow UI; README's Setup section points to
      where to find Configure/Reconfigure.
  docs-installation-parameters:
    status: done
    comment: strings.json's user/manual_connection/serial step descriptions document every field required during setup.
  entity-unavailable:
    status: done
    comment: Inherited from CoordinatorEntity, tracking coordinator.last_update_success.
  integration-owner: done
  log-when-unavailable:
    status: todo
    comment: |
      No verified log-once-then-suppress behavior for repeated connection
      failures; needs a dedicated check rather than assuming the
      reconnect/backoff logic in helpers/transport.py already covers this
      rule's specific intent.
  parallel-updates:
    status: done
    comment: |
      PARALLEL_UPDATES = 1 on every platform that writes to the panel's
      single serialized command buffer: alarm_control_panel, switch,
      sensor (zone bypass/trigger services), climate, light, number,
      scene, time. binary_sensor is read-only and left unset.
  reauthentication-flow:
    status: done
    comment: |
      async_step_reauth/async_step_reauth_confirm, triggered by
      ConfigEntryAuthFailed on a real "login" failure from the panel.
      Serial connections (no username/password) abort as
      reauth_unsupported rather than showing an inapplicable form.
  test-coverage:
    status: todo
    comment: |
      68 real, passing tests across 8 files (config flow, coordinator
      login/auth/arm-command/bypass dispatch, the alarm_control_panel
      action-exceptions fix, the area-openings binary_sensor and its
      device_class corrections, switch bypass idempotency, number counter
      services, domain-level services, and setup/unload/options-reload),
      up from two near-placeholder files with one failing test.
      `pytest --cov=custom_components.elkm1` measures 64% line coverage
      (2210 statements, 803 missed) - real, verified progress, not yet
      the >90% this rule wants. Weakest spots: coordinator.py's push
      broadcast handlers (54%), several read-only platforms' state/
      attribute properties, helpers/baud_probe.py and
      helpers/transport.py (the baud sweep/probe logic was verified
      extensively by hand against a real PTY during Milestone 1, but
      those runs weren't committed as repeatable tests), and
      helpers/usb_discovery.py's actual port enumeration (18%, hard to
      test meaningfully without real hardware or a pyserial mock).

  # Gold
  devices:
    status: done
    comment: |
      All entities attach to one panel-wide device via
      create_elk_system_device_info(). Splitting into per-area/per-keypad
      devices is tracked as follow-up work, not a rule failure - the rule
      requires entities belong to a device, not a specific device
      granularity.
  diagnostics: done
  discovery-update-info:
    status: done
    comment: async_update_entry_from_discovery updates a config entry's host if the panel's discovered IP changes.
  discovery:
    status: done
    comment: |
      DHCP discovery (network) and USB discovery (manifest.json usb key,
      async_step_usb) for serial adapters. No zeroconf/mDNS key: the
      M1XEP's discovery beacon is a proprietary UDP broadcast (handled by
      discovery.py), not mDNS, so a zeroconf manifest entry would be
      inaccurate.
  docs-data-update:
    status: done
    comment: README's Architecture section explains the push-first/poll-fallback data flow.
  docs-examples:
    status: done
    comment: docs/cross_integration.md's Better Thermostat section and the linked blueprints give concrete usage examples.
  docs-known-limitations:
    status: done
    comment: |
      docs/cross_integration.md's Alarmo and Better Thermostat sections
      explain the door/window device_class best-effort limitation in
      user-facing terms; PROJECT_MAP.md has the underlying protocol
      reasoning for contributors.
  docs-supported-devices:
    status: done
    comment: README states Elk-M1 Gold and M1EZ8 explicitly.
  docs-supported-functions:
    status: done
    comment: README's "What it creates" table lists every platform and what it covers.
  docs-troubleshooting:
    status: done
    comment: README's Troubleshooting section rewritten and verified against the current codebase (debug logging path, diagnostics download) rather than carried over unreviewed.
  docs-use-cases:
    status: done
    comment: docs/cross_integration.md covers the cross-integration use cases; README's "What it creates" and Services sections cover general usage.
  dynamic-devices:
    status: exempt
    comment: |
      The panel's hardware configuration (zone/output/task/etc. counts) is
      fixed at panel-programming time, not something devices can appear
      into after Home Assistant setup.
  entity-category: done
  entity-device-class:
    status: done
    comment: |
      Applied wherever the protocol actually signals a physical type
      (temperature, voltage, trouble/problem, etc.). Zone door/window/
      motion classification is best-effort by protocol necessity - see
      the comment above binary_sensor.py's _DEVICE_CLASS_MAP.
  entity-disabled-by-default:
    status: done
    comment: ElkTroubleBinarySensor (one per trouble condition) is disabled by default; enabling all 23 on every install by default would be noisy.
  entity-translations:
    status: todo
    comment: strings.json has no top-level "entity" section yet for translating generic entity-type names.
  exception-translations:
    status: todo
    comment: Exceptions raised throughout (HomeAssistantError, ConfigEntryAuthFailed, etc.) use plain f-string messages, not translation_domain/translation_key.
  icon-translations:
    status: todo
    comment: |
      A few entities set _attr_icon directly (mdi:shield-sync,
      mdi:shield-off, mdi:counter, mdi:shield-alert-outline) instead of
      going through icons.json, which doesn't exist yet.
  reconfiguration-flow:
    status: done
    comment: async_step_reconfigure (network) and async_step_reconfigure_serial, both via async_update_reload_and_abort.
  repair-issues:
    status: todo
    comment: |
      helpers/panel_settings.py's verify_panel_configuration() only logs a
      warning when a required Global Programming broadcast setting can't
      be confirmed; it doesn't raise a Repair issue the user would
      actually see in Settings > Repairs.
  stale-devices:
    status: exempt
    comment: Single static panel device; there's no per-device removal case to handle.

  # Platinum
  async-dependency:
    status: done
    comment: |
      elkm1_lib's message encode/decode and Elk/subsystem orchestration
      are used as-is; the one synchronous coupling point
      (Connection.connect()'s transport open) is replaced by native
      asyncio in helpers/transport.py via a monkeypatch of
      Connection.connect at the class level.
  inject-websession:
    status: exempt
    comment: No HTTP requests - this integration only speaks the Elk-M1 ASCII protocol over serial/TCP.
  strict-typing:
    status: todo
    comment: |
      `mypy --config-file mypy.ini` (now strict = true, scoped to
      custom_components/elkm1) reports 42 real errors across 10 files as
      of this check (coordinator.py 15, climate.py 7, config_flow.py 6,
      light.py 3, alarm_control_panel.py 3, switch.py/number.py/
      device_action.py 2 each, services.py/discovery.py 1 each). The
      largest category (coordinator.py) is elkm1_lib's Elements[T]
      collections being typed as the generic Element base class rather
      than the real Zone/Area/Output/etc. subclasses the coordinator
      actually reads subclass-only attributes off - an upstream typing
      gap in elkm1_lib, not a runtime bug (verified via real elkm1_lib
      object behavioral tests throughout development). Working through
      the rest is tracked as follow-up.
