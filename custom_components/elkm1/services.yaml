trigger_zone:
  name: Trigger Zone
  description: Momentarily violate a hardwired zone.
  fields:
    zone_number:
      name: Zone Number
      description: The Elk zone number (1-208) to trigger.
      required: true
      selector:
        number:
          min: 1
          max: 208

force_arm_away:
  name: Force Arm Away
  description: Force arm the system to Away mode, bypassing open zones.
  fields:
    area:
      name: Area
      description: The Area to arm (1-8).
      required: true
      selector:
        number:
          min: 1
          max: 8
    pin_code:
      name: PIN Code
      description: 4 or 6 digit user PIN code.
      required: true
      selector:
        text:

bypass_zone:
  name: Bypass Zone
  description: Bypass or unbypass a specific zone.
  fields:
    zone_number:
      name: Zone Number
      description: Zone to bypass (1-208).
      required: true
      selector:
        number:
          min: 1
          max: 208
    pin_code:
      name: PIN Code
      description: Valid user PIN code.
      required: true
      selector:
        text:

unbypass_zone:
  name: Unbypass Zone
  description: Unbypass a zone
  fields:
    zone:
      name: Zone
      description: Zone number or name to unbypass
      required: true
      selector:
        number:
          min: 1
          max: 208

panic_alarm:
  name: Trigger Panic Alarm
  description: Trigger a panic alarm
  fields:
    panic_type:
      name: Panic Type
      description: Type of panic alarm (police/fire/ambulance)
      required: true
      selector:
        select:
          options:
            - police
            - fire
            - ambulance

arm_stay:
  name: Arm Stay
  description: Arm panel in stay mode
  fields:
    user_code:
      name: User Code
      description: Optional user code
      required: false
      selector:
        number:
          min: 0
          max: 999999

disarm:
  name: Disarm Panel
  description: Disarm the alarm panel
  fields:
    user_code:
      name: User Code
      description: Disarm code
      required: true
      selector:
        number:
          min: 0
          max: 999999

set_temperature:
  name: Set Thermostat Temperature
  description: Set the thermostat to a target temperature
  fields:
    temperature:
      name: Temperature
      description: Target temperature in degrees
      required: true
      selector:
        number:
          min: 50
          max: 90
          step: 0.1
