[mypy]
python_version = 3.13
files = custom_components/elkm1
show_error_codes = true
follow_imports = silent
ignore_missing_imports = true
strict = true
warn_unused_ignores = true

; As of this config landing, `mypy --config-file mypy.ini custom_components/elkm1`
; reports 33 real errors (see custom_components/elkm1/quality_scale.yaml's
; strict-typing entry for the current count/breakdown) - mostly
; elkm1_lib's Elements[T] collections being typed as the Element base
; class rather than the real Zone/Area/Output/etc. subclasses, which the
; coordinator accesses subclass-only attributes on. That's a gap in
; elkm1_lib's own type stubs, not something silenced here.
