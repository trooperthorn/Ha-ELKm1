automation:
  - alias: "Chime: Front Door Opened"
    description: "Plays an Elk-M1 vocabulary announcement when the front door opens while disarmed."
    trigger:
      - platform: state
        entity_id: binary_sensor.elk_m1_front_door
        to: "on"
    condition:
      - condition: state
        entity_id: alarm_control_panel.alarm_panel
        state: "disarmed"
    action:
      - service: elkm1.speak_phrase
        data:
          number: 146
