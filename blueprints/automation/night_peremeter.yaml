automation:
  - alias: "Security: Good Night Perimeter Guard"
    description: "Arms the Elk-M1 in night mode when sleep mode activates, and warns via keypad/speakers if windows are open."
    trigger:
      - platform: state
        entity_id: input_boolean.sleep_mode
        to: "on"
    action:
      - service: alarm_control_panel.alarm_arm_night
        target:
          entity_id: alarm_control_panel.alarm_panel
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: sensor.elk_m1_open_windows
                above: 0
            sequence:
              - service: elkm1.speak_phrase
                data:
                  number: 464
