blueprint:
  name: "ELK-M1: Presence-Driven Arming & Disarming"
  description: |
    Automatically arms the ELK-M1 security system when all family members leave home 
    (with a configurable grace period), and disarms or runs a welcome routine when the 
    first person arrives back home.
  domain: automation
  source_url: https://github.com/trooperthorn/ha_int_elkm1/blob/main/blueprints/automation/presence_arming.yaml

  input:
    tracked_persons:
      name: Tracked Persons
      description: Select all family member person entities to monitor via Bluetooth/GPS presence.
      selector:
        entity:
          domain: person
          multiple: true

    departure_delay:
      name: Departure Grace Period (minutes)
      description: Time to wait after the last person leaves before automatically arming the system.
      default: 5
      selector:
        number:
          min: 0
          max: 30
          step: 1

    departure_action:
      name: Arm System Action (Departure)
      description: The action to execute when everyone has left (e.g., alarm_control_panel.alarm_arm_away).
      selector:
        action: {}

    arrival_action:
      name: Disarm System Action (Arrival)
      description: The action to execute when the first person arrives home (e.g., alarm_control_panel.alarm_disarm).
      selector:
        action: {}

trigger:
  - platform: numeric_state
    entity_id: !input tracked_persons
    below: 1
    value_template: "{{ states.person | selectattr('attributes.id', 'in', states.person | map(attribute='attributes.id') | list) | selectattr('state', 'eq', 'home') | list | count }}"
    id: everyone_left

  - platform: state
    entity_id: !input tracked_persons
    to: "home"
    from: "not_home"
    id: someone_arrived

action:
  - choose:
      # SCENARIO 1: Everyone Left -> Wait for Grace Period -> Re-verify -> Arm
      - conditions:
          - condition: trigger
            id: everyone_left
        sequence:
          - delay:
              minutes: !input departure_delay
          - condition: numeric_state
            entity_id: !input tracked_persons
            below: 1
            value_template: "{{ states.person | selectattr('state', 'eq', 'home') | list | count }}"
          - choose:
              - conditions: []
                sequence: !input departure_action

      # SCENARIO 2: First Person Arrived Home -> Disarm / Welcome
      - conditions:
          - condition: trigger
            id: someone_arrived
        sequence:
          - choose:
              - conditions: []
                sequence: !input arrival_action
